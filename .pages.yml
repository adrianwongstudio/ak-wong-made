# Pages CMS configuration — https://pagescms.org
# Sign in at https://app.pagescms.org, connect this repo, and everything below
# becomes editable in-browser. Edits commit straight to GitHub; Cloudflare
# Pages rebuilds automatically.

media:
  input: public
  output: /

content:
  # ─── Projects (case studies) ─────────────────────────────
  - name: projects
    label: Work — case studies
    path: src/content/projects
    type: collection
    format: yaml-frontmatter
    filename: '{fields.title|slugify}.md'
    view:
      fields: [title, year, client, featured, hasCaseStudy]
      primary: title
      sort: [order, year, title]
      default:
        sort: order
        order: asc
    fields:
      - { name: title,        label: Title,                type: string, required: true }
      - { name: year,         label: Year,                 type: number, required: true }
      - { name: client,       label: Client,               type: string, required: true }
      - name: services
        label: Services
        type: select
        list: true
        options:
          values: ['Automation', 'Website', 'Web App']
        required: true
      - { name: stack,        label: Stack (tags),         type: string, list: true }
      - { name: liveUrl,      label: Live URL,             type: string }
      - { name: repoUrl,      label: Repo URL,             type: string }
      - { name: thumb,        label: Thumbnail,            type: image }
      - { name: featured,     label: Featured on home?,    type: boolean, default: false }
      - { name: hasCaseStudy, label: Has full case study?, type: boolean, default: false, description: "If off, project card links directly to Live URL." }
      - { name: order,        label: Sort order,           type: number, default: 0 }
      - { name: body,         label: Case study body,      type: rich-text }

  # ─── Blog posts ──────────────────────────────────────────
  - name: posts
    label: Blog posts
    path: src/content/posts
    type: collection
    format: yaml-frontmatter
    filename: '{fields.title|slugify}.md'
    view:
      fields: [title, date, tags, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title,       label: Title,       type: string, required: true }
      - { name: date,        label: Date,        type: date,   required: true }
      - { name: tags,        label: Tags,        type: string, list: true }
      - { name: description, label: Description, type: text,   required: true, description: "Shown on the blog index and used as the meta description." }
      - { name: hero,        label: Hero image,  type: image }
      - { name: draft,       label: Draft?,      type: boolean, default: false }
      - { name: body,        label: Body,        type: rich-text }

  # ─── Life timeline ───────────────────────────────────────
  - name: life
    label: Life timeline
    path: src/content/life
    type: collection
    format: yaml-frontmatter
    filename: '{fields.year}-{fields.title|slugify}.md'
    view:
      fields: [title, year, era, type, featured]
      primary: title
      sort: [year, order, title]
      default:
        sort: year
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: year,  label: Year,  type: number, required: true }
      - name: era
        label: Era
        type: select
        options:
          values: ['Studio Life', 'Corporate Years', 'University', 'Growing Up']
        required: true
      - name: type
        label: Type
        type: select
        default: milestone
        options:
          values: ['milestone', 'era-marker', 'birth']
        description: "Almost always 'milestone'. 'birth' is the one book-end marker."
      - { name: image,    label: Image,               type: image }
      - { name: featured, label: Featured card?,      type: boolean, default: false, description: "Featured entries get the filled-blue image treatment on the timeline." }
      - { name: order,    label: Order (within year), type: number,  default: 0 }
      - { name: body,     label: Body,                type: rich-text }
